<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louis's Bar Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Louis's Bar</h1>
    <h2>MENU</h2>

    <div class="category-tabs">
        <button class="tab-btn active" onclick="filterMenu('all', event)">All</button>
        <button class="tab-btn" onclick="filterMenu('alcoholic', event)">Alcoholic</button>
        <button class="tab-btn" onclick="filterMenu('non-alcoholic', event)">Non-Alcoholic</button>
        <button class="tab-btn" onclick="filterMenu('custom', event)">Signatures</button>
    </div>

    <section class="menu-section" id="menu-items-container"></section>

    <div id="toast" class="toast-hidden">Added to tray! 🍸</div>

    <div id="cart-container" class="cart-container">
        <div id="cart-modal" class="modal-content">
            <div id="cart-items-list"></div>
            <div class="modal-footer">
                <button class="checkout-btn" onclick="sendWhatsAppOrder()">Confirm & Order 🍹</button>
            </div>
        </div>

        <div id="cart-bar" class="cart-bar" onclick="toggleCartModal()">
            <div class="cart-info">
                <span id="cart-count">0</span> items
            </div>
            <p class="tap-hint">Tap to view</p>
            <button id="order-now-btn" onclick="sendWhatsAppOrder(); event.stopPropagation();">Order Now</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
