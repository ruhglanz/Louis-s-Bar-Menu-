<!DOCTYPE html>
<html>
<head>
    <title>Welcome to Louis's Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Louis's Bar</h1>
    <h2>MENU</h2>

    <div class="menu-card">
        <p class="dish-name">1. Bartender Special</p>
        <img src="bartenderspecial.jpg" class="menu-img">
        <button onclick="showOrderToast('Bartender Special')">Order this</button>
    </div>

    <div class="menu-card">
        <p class="dish-name">2. Ruhglanz</p>
        <img src="ruhglanz.jpg" class="menu-img">
        <button onclick="showOrderToast('Ruhglanz')">Order this</button>
    </div>

    <div class="menu-card">
        <p class="dish-name">3. Cocktail</p>
        <img src="cocktail.jpg" class="menu-img">
        <button onclick="showOrderToast('Cocktail')">Order this</button>
    </div>

    <div id="toast" class="toast-hidden">Your order has been placed! 🍸</div>

    <script src="script.js"></script>
</body>
</html>
