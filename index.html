<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Louis's Bar | Digital Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Louis's Bar</h1>
    <h2>MENU</h2>

    <div class="category-tabs">
        <button class="tab-btn active" onclick="filterMenu('all', event)">All</button>
        <button class="tab-btn" onclick="filterMenu('alcoholic', event)">Alcoholic</button>
        <button class="tab-btn" onclick="filterMenu('non-alcoholic', event)">Non-Alcoholic</button>
        <button class="tab-btn" onclick="filterMenu('wine', event)">Wine</button>
        <button class="tab-btn" onclick="filterMenu('custom', event)">Custom</button>
        <button class="tab-btn" onclick="filterMenu('others', event)">Others</button>
    </div>

    <section class="menu-section" id="menu-items-container">
        <div class="menu-card" data-category="custom alcoholic">
            <div class="badge">Best Seller ✨</div>
            <p class="dish-name">1. Bartender Special</p>
            <img src="bartenderspecial.jpg" class="menu-img" alt="Bartender Special">
            <button onclick="addToCart('Bartender Special', 0)">Add to Cart</button>
        </div>
        
        <div class="menu-card" data-category="custom alcoholic">
            <p class="dish-name">2. Ruhglanz</p>
            <img src="ruhglanz.jpg" class="menu-img" alt="Ruhglanz">
            <button onclick="addToCart('Ruhglanz', 0)">Add to Cart</button>
        </div>
        
        <div class="menu-card" data-category="custom alcoholic">
            <p class="dish-name">3. Curated by Khaimin</p>
            <img src="curatedbykhaimin.jpg" class="menu-img" alt="Curated by Khaimin">
            <button onclick="addToCart('Curated by Khaimin', 0)">Add to Cart</button>
        </div>

        <div class="menu-card" data-category="non-alcoholic">
            <p class="dish-name">4. Mojito (Virgin)</p>
            <img src="mojito.jpg" class="menu-img" alt="Mojito">
            <button onclick="addToCart('Mojito', 0)">Add to Cart</button>
        </div>
        
        <div class="menu-card" data-category="non-alcoholic">
            <p class="dish-name">5. Mocktail</p>
            <img src="mocktail.jpg" class="menu-img" alt="Mocktail">
            <button onclick="addToCart('Mocktail', 0)">Add to Cart</button>
        </div>
        
        <div class="menu-card" data-category="non-alcoholic">
            <p class="dish-name">6. Strawberry Smoothie</p>
            <img src="milkshake.jpg" class="menu-img" alt="Smoothie">
            <button onclick="addToCart('Smoothie', 0)">Add to Cart</button>
        </div>
    </section>

    <div id="toast" class="toast-hidden">Added to your tray! 🍸</div>

    <div id="cart-container" class="cart-container">
        
        <div id="cart-modal" class="modal-content">
            <div id="cart-items-list"></div>
            
            <div class="modal-footer" style="padding: 20px 0; border-top: 1px solid rgba(255,255,255,0.1);">
                <button class="checkout-btn" onclick="sendWhatsAppOrder()" style="width: 100%; padding: 15px; background: linear-gradient(135deg, #d4b475 0%, #c5a059 100%); border: none; border-radius: 15px; color: #1a130f; font-weight: 800; font-size: 16px; cursor: pointer;">
                    Confirm & Order 🍹
                </button>
            </div>
        </div>

        <div id="cart-bar" class="cart-bar" onclick="toggleCartModal()">
            <div class="cart-info">
                <span id="cart-count">0</span> items
            </div>
            
            <p class="tap-hint">Tap to view</p>
            
            <div class="cart-action">
                <button id="order-now-btn" onclick="sendWhatsAppOrder(); event.stopPropagation();">Order Now</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
